<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 80 1000 460" role="img" aria-label="Subway diagram of the Vibe Crafting process. The spec line runs through six stations, project overview, functional spec, UI design if needed, architecture, component designs if needed, and implementation plan, with optional research on overview, functional spec and architecture. It curves into the implement line, where phase 1 is shown in full: code, review, and commit, with a needs-changes loop from review back to code and a quick-fix detour from review to commit. Phases 2 through N repeat the same loop. It then curves into the review and ship line: optional deep code review, open PR, optional PR feedback with a loop for new review comments, and merge.">
<style>
svg { --d-panel: #ffffff; --d-ink: #1b1e27; --d-muted: #656c7e; --d-faint: #a2a7b3; --d-on: #ffffff; --d-spec: #4a54c4; --d-build: #127e63; --d-ship: #b8680b; }
@media (prefers-color-scheme: dark) { svg { --d-panel: #161921; --d-ink: #e7e9ef; --d-muted: #9aa1b2; --d-faint: #636a7a; --d-on: #11131a; --d-spec: #9198f3; --d-build: #4cc59d; --d-ship: #eea24a; } }
/* Diagram vocabulary */
text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.paper { fill: var(--d-panel); }
.lbl { font-size: 12.5px; font-weight: 500; fill: var(--d-ink); }
.sub { font-size: 11px; fill: var(--d-muted); }
.faint { font-size: 11px; fill: var(--d-faint); }
.cmd { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: var(--d-muted); }
.ph { font-size: 12px; font-weight: 600; fill: var(--d-ink); }
.badge-t { font-size: 11px; font-weight: 700; letter-spacing: .1em; fill: var(--d-on); }
.mid { text-anchor: middle; } .end { text-anchor: end; }
.ln { fill: none; stroke-width: 8; stroke-linecap: round; }
.ln.spec { stroke: var(--d-spec); }
.ln.build { stroke: var(--d-build); } .ln.ship { stroke: var(--d-ship); }
.f-spec { fill: var(--d-spec); } .f-build { fill: var(--d-build); } .f-ship { fill: var(--d-ship); } .f-muted { fill: var(--d-muted); }
.st { fill: var(--d-panel); stroke-width: 4; }
.st.spec { stroke: var(--d-spec); } .st.build { stroke: var(--d-build); } .st.ship { stroke: var(--d-ship); } .st.muted { stroke: var(--d-muted); }
.st.opt { stroke-width: 3; stroke-dasharray: 3.2 2.6; }
.pill { fill: var(--d-panel); stroke: var(--d-build); stroke-width: 2.5; }
.pill.opt { stroke-width: 1.5; stroke-dasharray: 4 3; }
.loop { fill: none; stroke: var(--d-build); stroke-width: 3; }
.e { fill: none; stroke-width: 1.75; }
.e.spec { stroke: var(--d-spec); } .e.build { stroke: var(--d-build); } .e.ship { stroke: var(--d-ship); }
.dash { stroke-dasharray: 4 4; }
.chev { fill: none; stroke: var(--d-panel); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>

      <rect class="paper" y="80" width="1000" height="460" rx="14"/>

      <!-- ===== SPEC ===== -->
      <text class="cmd" x="36" y="106">/spec new project</text>

      <path class="ln spec" d="M100,130 H880"/>
      <path class="ln build" d="M880,130 A80,80 0 0 1 880,290 H120"/>
      <path class="ln ship" d="M120,290 A80,80 0 0 0 120,450 H800"/>

      <path class="chev" d="M233,126.5 L238,130 L233,133.5 M367,126.5 L372,130 L367,133.5 M501,126.5 L506,130 L501,133.5 M635,126.5 L640,130 L635,133.5 M769,126.5 L774,130 L769,133.5"/>

      <rect class="f-spec" x="36" y="117" width="68" height="26" rx="13"/>
      <text class="badge-t mid" x="70" y="134">SPEC</text>

      <circle class="st spec" cx="168" cy="130" r="9"/>
      <circle class="st spec" cx="302" cy="130" r="9"/>
      <circle class="st spec opt" cx="436" cy="130" r="9"/>
      <circle class="st spec" cx="570" cy="130" r="9"/>
      <circle class="st spec opt" cx="704" cy="130" r="9"/>
      <circle class="st spec" cx="838" cy="130" r="9"/>
      <text class="lbl mid" x="168" y="162">Project overview</text><text class="faint mid" x="168" y="178">optional research</text>
      <text class="lbl mid" x="302" y="162">Functional spec</text><text class="faint mid" x="302" y="178">optional research</text>
      <text class="lbl mid" x="436" y="162">UI design</text><text class="sub mid" x="436" y="178">if needed</text>
      <text class="lbl mid" x="570" y="162">Architecture</text><text class="faint mid" x="570" y="178">optional research</text>
      <text class="lbl mid" x="704" y="162">Component designs</text><text class="sub mid" x="704" y="178">if needed</text>
      <text class="lbl mid" x="838" y="162">Implementation plan</text>

      <!-- ===== IMPLEMENT ===== -->
      <text class="cmd end" x="902" y="266">/spec implement all</text>
      <rect class="f-build" x="798" y="277" width="104" height="26" rx="13"/>
      <text class="badge-t mid" x="850" y="294">IMPLEMENT</text>

      <text class="ph mid" x="608" y="232">Phase 1</text>
      <text class="ph mid" x="400" y="232">Phase 2</text>
      <text class="ph mid" x="300" y="232">Phase 3</text>
      <text class="ph mid" x="200" y="232">Phase N</text>

      <path class="chev" d="M783,286.5 L778,290 L783,293.5 M683,286.5 L678,290 L683,293.5 M553,286.5 L548,290 L553,293.5 M443,286.5 L438,290 L443,293.5"/>

      <!-- phase 1, expanded -->
      <path class="e build" d="M610,278 C610,236 730,236 730,268"/>
      <path class="f-build" d="M725.5,268 L734.5,268 L730,277 Z"/>
      <text class="sub mid" x="670" y="266">needs changes</text>
      <rect class="pill" x="698" y="278" width="64" height="24" rx="12"/>
      <text class="lbl mid" x="730" y="294.5">Code</text>
      <rect class="pill" x="572" y="278" width="76" height="24" rx="12"/>
      <text class="lbl mid" x="610" y="294.5">Review</text>
      <rect class="pill" x="454" y="278" width="72" height="24" rx="12"/>
      <text class="lbl mid" x="490" y="294.5">Commit</text>

      <path class="e build" d="M610,302 Q610,330 597,330"/>
      <path class="f-build" d="M597,325.5 L597,334.5 L588,330 Z"/>
      <path class="e build" d="M512,330 Q490,330 490,311"/>
      <path class="f-build" d="M485.5,311 L494.5,311 L490,302 Z"/>
      <rect class="pill opt" x="512" y="319" width="76" height="22" rx="11"/>
      <text class="sub mid" x="550" y="334" style="fill:var(--d-ink)">quick fix</text>

      <!-- phases 2..N -->
      <circle class="loop" cx="400" cy="271" r="14"/><path class="f-build" d="M395,257 L402,253 L402,261 Z"/>
      <circle class="st build" cx="372" cy="290" r="6"/>
      <circle class="loop" cx="300" cy="271" r="14"/><path class="f-build" d="M295,257 L302,253 L302,261 Z"/>
      <circle class="st build" cx="272" cy="290" r="6"/>
      <circle class="f-build" cx="242" cy="271" r="2.6"/><circle class="f-build" cx="250" cy="271" r="2.6"/><circle class="f-build" cx="258" cy="271" r="2.6"/>
      <circle class="loop" cx="200" cy="271" r="14"/><path class="f-build" d="M195,257 L202,253 L202,261 Z"/>
      <circle class="st build" cx="172" cy="290" r="6"/>
      <text class="sub mid" x="300" y="320">same loop</text>

      <!-- ===== REVIEW & SHIP ===== -->
      <rect class="f-ship" x="110" y="437" width="132" height="26" rx="13"/>
      <text class="badge-t mid" x="176" y="454">REVIEW &amp; SHIP</text>

      <path class="chev" d="M275,446.5 L280,450 L275,453.5 M398,446.5 L403,450 L398,453.5 M558,446.5 L563,450 L558,453.5 M718,446.5 L723,450 L718,453.5"/>

      <path class="e ship" d="M640,440 C640,392 480,392 480,430"/>
      <path class="f-ship" d="M475.5,430 L484.5,430 L480,439 Z"/>
      <text class="sub mid" x="560" y="394">new review comments</text>

      <circle class="st ship opt" cx="320" cy="450" r="9"/>
      <circle class="st ship" cx="480" cy="450" r="9"/>
      <circle class="st ship opt" cx="640" cy="450" r="9"/>
      <circle class="f-ship" cx="800" cy="450" r="12"/><circle class="paper" cx="800" cy="450" r="4.5"/>
      <text class="lbl mid" x="320" y="482">Deep code review</text><text class="cmd mid" x="320" y="498">/spec deep cr</text>
      <text class="lbl mid" x="480" y="482">Open PR</text>
      <text class="lbl mid" x="640" y="482">Address PR feedback</text><text class="cmd mid" x="640" y="498">/spec pr</text>
      <text class="lbl mid" x="800" y="482">Merge</text>

      <!-- legend -->
      <circle class="st muted opt" cx="828" cy="520" r="6" style="stroke-width:2.2"/>
      <text class="sub" x="842" y="524">optional or conditional</text>
    </svg>
